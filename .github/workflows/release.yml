# Release + auto-update: build đa nền tảng, upload GitHub Release + latest.json (Tauri updater).
# Cần GitHub secrets:
#   TAURI_SIGNING_PRIVATE_KEY — nội dung private key (hoặc base64), khớp pubkey trong tauri.conf.json
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — (tuỳ chọn) nếu key có mật khẩu
# macOS production (Developer ID + notarization) — khớp https://v2.tauri.app/distribute/sign/macos
#   APPLE_CERTIFICATE — base64 file .p12 (export từ Keychain)
#   APPLE_CERTIFICATE_PASSWORD — mật khẩu file .p12
#   KEYCHAIN_PASSWORD — mật khẩu keychain tạm trên runner (chuỗi bất kỳ, vd. random)
#   APPLE_SIGNING_IDENTITY — (tuỳ chọn) chuỗi đầy đủ identity; nếu thiếu, CI lấy từ keychain (ưu tiên "Developer ID Application")
# Notarization — một trong hai cách:
#   A) Apple ID: APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#   B) App Store Connect API (khuyến nghị CI): APPLE_API_KEY (Key ID), APPLE_API_ISSUER, APPLE_API_KEY_P8_BASE64 (nội dung .p8 base64)
# Tuỳ chọn — mirror release lên Cloudflare R2 (job upload-r2 luôn chạy sau verify; thiếu secret R2 → bỏ qua upload, job vẫn success).
#   Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   Biến repo R2_PUBLIC_BASE_URL — URL HTTPS công khai (vd. https://updates.example.com), rewrite latest.json
#   Biến repo R2_PREFIX (mặc định assetbender): prefix trong bucket + URL CDN
# Tag: git tag v0.1.0 && git push origin v0.1.0
# Trước release lần đầu: thay pubkey trong tauri.conf.json bằng pubkey khớp secret (pnpm exec tauri signer generate).
# Nếu commit `.tauri/updater.key.pub`, workflow sẽ chạy `pnpm run pubkey:sync` trước build để pubkey trong JSON khớp file .pub.
# Cache (2 lớp — khuyến nghị Tauri + pnpm):
#   - actions/setup-node cache: pnpm + cache-dependency-path: pnpm-lock.yaml (commit lockfile)
#   - Swatinem/rust-cache@v2: workspaces src-tauri -> target; prefix-key release + key matrix target
#
# Notarization — ghi nhận thực tế (không phải lỗi workflow mỗi khi chậm):
#   1) Log "Notarizing..." lâu có thể chỉ là hàng chờ Apple, không nhất thiết CI sai.
#   2) Lần đầu notarize team/app thường chậm hơn hoặc vướng quyền/cấu hình phía Apple.
#   3) Chỉ dựa vào notarytool --wait dễ "câm"; muốn thấy submit id + poll + log khi Invalid:
#      scripts/notarize-dmg-notarytool-poll.sh (submit → poll info mỗi 20s → notarytool log nếu Invalid → stapler).
#      Tích hợp đầy đủ cần: tauri build **không** truyền APPLE_API_* (chỉ ký), chạy script, rồi upload asset
#      (tauri-action gộp build+upload — tách bước hoặc gh release upload + latest.json theo tài liệu updater).
# Ví dụ bước sau build (khi đã bỏ APPLE_API_* khỏi tauri build và có file .dmg + env từ Prepare):
#   - run: bash scripts/notarize-dmg-notarytool-poll.sh
#     if: matrix.platform == 'macos-latest'
#     env:
#       APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
#       APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
#       APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}

name: Release

on:
  push:
    tags:
      - "v*"

# JS actions (checkout/setup-node/pnpm) dùng Node 24 — tránh cảnh báo deprecation Node 20 (GitHub 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --verbose: log rõ khi ký + notarize (notarytool submit --wait có thể vài phút; tránh cảm giác CI "treo").
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --verbose --verbose"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --verbose --verbose"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Point updater to this repository
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "src-tauri/tauri.conf.json";
          let s = fs.readFileSync(path, "utf8");
          s = s.replace(/OWNER\/REPO/g, process.env.GITHUB_REPOSITORY);
          fs.writeFileSync(path, s);
          NODE
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Sync updater pubkey into tauri.conf.json
        if: hashFiles('.tauri/updater.key.pub') != ''
        shell: bash
        run: node scripts/sync-updater-pubkey.mjs

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release
          workspaces: |
            src-tauri -> target
          # Phân biệt matrix (aarch64 / x86_64 / Windows); bump prefix-key nếu cache hỏng lạ
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - run: pnpm install --frozen-lockfile

      # Build trên macOS runner: import .p12 + chuẩn bị .p8 (App Store Connect API) — Tauri CLI đọc env khi bundle/sign/notarize.
      - name: Prepare Apple signing and notarization (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY_INPUT: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # App Store Connect API key — notarization (JWT), khuyến nghị cho CI
          if [ -n "${APPLE_API_KEY_P8_BASE64:-}" ] && [ -n "${APPLE_API_KEY:-}" ]; then
            mkdir -p "${RUNNER_TEMP}/private_keys"
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "${RUNNER_TEMP}/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            chmod 600 "${RUNNER_TEMP}/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            echo "APPLE_API_KEY_PATH=${RUNNER_TEMP}/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          fi

          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::APPLE_CERTIFICATE chưa cấu hình — bản macOS build ad-hoc (không Developer ID / không notarize qua chứng chỉ Apple). Xem v2.tauri.app/distribute/sign/macos"
            exit 0
          fi
          if [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::Khi dùng APPLE_CERTIFICATE cần KEYCHAIN_PASSWORD (secret)."
            exit 1
          fi
          # Base64 từ GitHub Secret thường bị xuống dòng / khoảng trắng khi paste — strip trước khi decode
          CERT_B64=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '\n\r\t ')
          printf '%s' "$CERT_B64" | base64 --decode > certificate.p12
          if [ ! -s certificate.p12 ]; then
            echo "::error::Decode base64 thất bại hoặc rỗng — kiểm tra secret APPLE_CERTIFICATE (một dòng base64, openssl base64 -A)."
            exit 1
          fi
          # Mật khẩu chỉ qua env (tránh ký tự đặc biệt / khác biệt openssl vs security -P)
          export P12_PASSWORD="${APPLE_CERTIFICATE_PASSWORD:-}"
          UNWRAPPED="${RUNNER_TEMP}/apple-cert-import.pem"
          # Giải mã PKCS#12 bằng openssl rồi import PEM — tránh lỗi SecKeychainItemImport/MAC với một số .p12 khi dùng trực tiếp security import
          if ! openssl pkcs12 -in certificate.p12 -nodes -passin env:P12_PASSWORD -out "$UNWRAPPED" 2>/dev/null; then
            if ! openssl pkcs12 -legacy -in certificate.p12 -nodes -passin env:P12_PASSWORD -out "$UNWRAPPED" 2>/dev/null; then
              echo "::error::openssl không giải mã được .p12 (sai mật khẩu, file hỏng, hoặc định dạng lạ). Thử: openssl pkcs12 -info -in cert.p12 -passin pass:... trên Mac; re-export .p12 từ Keychain."
              openssl pkcs12 -in certificate.p12 -nodes -passin env:P12_PASSWORD -out "$UNWRAPPED" 2>&1 || true
              exit 1
            fi
          fi
          rm -f certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          # `-f` đứng một mình là sai: `security import -f` phải có format (pemseq, openssl, …). Bỏ `-f` để Keychain tự nhận PEM.
          security import "$UNWRAPPED" -k build.keychain -T /usr/bin/codesign
          rm -f "$UNWRAPPED"
          unset P12_PASSWORD
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

          if [ -n "${APPLE_SIGNING_IDENTITY_INPUT:-}" ]; then
            {
              echo 'APPLE_SIGNING_IDENTITY<<EOF'
              echo "${APPLE_SIGNING_IDENTITY_INPUT}"
              echo 'EOF'
            } >> "$GITHUB_ENV"
          else
            CERT_LINE=$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 || true)
            if [ -z "$CERT_LINE" ]; then
              CERT_LINE=$(security find-identity -v -p codesigning build.keychain | grep 'Apple Development' | head -1 || true)
            fi
            if [ -n "$CERT_LINE" ]; then
              CERT_ID=$(echo "$CERT_LINE" | awk -F'"' '{print $2}')
              {
                echo 'APPLE_SIGNING_IDENTITY<<EOF'
                echo "$CERT_ID"
                echo 'EOF'
              } >> "$GITHUB_ENV"
            fi
          fi

      # Tránh NSURLError -1009 / "No network route" ngay lúc notarize: đợi outbound HTTPS tới Apple (runner đôi khi chậm sẵn sàng).
      - name: Wait for outbound HTTPS to Apple (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl -sfI --connect-timeout 20 --max-time 45 "https://appstoreconnect.apple.com" >/dev/null 2>&1 \
              || curl -sfI --connect-timeout 20 --max-time 45 "https://developer.apple.com" >/dev/null 2>&1; then
              echo "::notice::Outbound HTTPS tới Apple OK (lần $attempt)."
              exit 0
            fi
            echo "::warning::Chưa có route HTTPS tới Apple (lần $attempt/24), chờ 15s..."
            sleep 15
          done
          echo "::error::Sau ~6 phút vẫn không kết nối được tới Apple — kiểm tra GitHub Actions / mạng. Lỗi notarize hay gặp: NSURLError -1009."
          exit 1

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Ký app + notarize (chỉ dùng trên job macOS; Windows bỏ qua)
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          projectPath: .
          tauriScript: pnpm exec tauri
          tagName: ${{ github.ref_name }}
          releaseName: AssetBender ${{ github.ref_name }}
          releaseBody: "Installers and latest.json for the Tauri updater. See https://v2.tauri.app/plugin/updater/"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # Tauri build (kể cả lỗi notarize -1009 tạm thời) được thử lại — xem README tauri-action.
          retryAttempts: 3
          args: ${{ matrix.args }}

      - name: Verify macOS code signature and Gatekeeper
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find src-tauri/target -type d -name "AssetBender.app" 2>/dev/null | head -1)
          if [ -z "${APP:-}" ]; then
            echo "::error::Không tìm thấy AssetBender.app dưới src-tauri/target (sau tauri build)."
            find src-tauri/target -type d -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "Verifying bundle: $APP"
          codesign -dv --verbose=4 "$APP" 2>&1
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "spctl (Gatekeeper — cần accepted / Developer ID + Notarized khi đã notarize):"
          spctl --assess --verbose --type execute "$APP"
          echo "stapler validate (ticket notarization trên bundle):"
          stapler validate "$APP"

  # Fail sớm nếu không có latest.json — tránh app/updater 404 im lặng.
  verify-release-has-updater-json:
    name: Verify release has latest.json
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            // GET .../releases/tags/{tag} trả 404 với release **draft** — phải list releases (có draft).
            let release = null;
            for (let page = 1; page <= 10; page++) {
              const { data } = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              release = data.find((r) => r.tag_name === tag);
              if (release) break;
              if (data.length < 100) break;
            }
            if (!release) {
              core.setFailed(
                `Không tìm thấy release cho tag ${tag} (kể cả draft). Đợi job publish-tauri tạo release xong.`,
              );
              return;
            }
            const asset = release.assets.find((a) => a.name === "latest.json");
            if (!asset) {
              core.setFailed(
                'Thiếu asset "latest.json" trên release — URL .../releases/latest/download/latest.json sẽ 404. ' +
                  "Cần: bundle.createUpdaterArtifacts: true trong tauri.conf.json, " +
                  "secret TAURI_SIGNING_PRIVATE_KEY khớp pubkey, và includeUpdaterJson: true trên tauri-action.",
              );
            } else {
              core.notice(`OK: latest.json (${asset.size} bytes)`);
            }

  # Mirror toàn bộ asset release + latest.json lên Cloudflare R2 (HTTPS công khai cho updater/CDN).
  upload-r2:
    name: Mirror release to Cloudflare R2
    needs: verify-release-has-updater-json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Check R2 secrets
        id: r2
        run: |
          if [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::R2 secrets chưa đủ — bỏ qua mirror (cấu hình R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET)."
          fi
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

      - name: Download GitHub release assets
        if: steps.r2.outputs.ok == 'true'
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cd release-assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Point latest.json URLs to CDN (R2 public URL)
        if: steps.r2.outputs.ok == 'true' && vars.R2_PUBLIC_BASE_URL != ''
        env:
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          LATEST_JSON_PATH: release-assets/latest.json
        run: node scripts/rewrite-updater-manifest-for-r2.mjs

      - name: Upload to R2 (S3 API)
        if: steps.r2.outputs.ok == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          PREFIX="${R2_PREFIX:-assetbender}"
          TAG="${GITHUB_REF_NAME}"
          aws s3 sync release-assets "s3://${R2_BUCKET}/${PREFIX}/${TAG}/" \
            --endpoint-url "${ENDPOINT}" \
            --region auto
          aws s3 cp "release-assets/latest.json" "s3://${R2_BUCKET}/${PREFIX}/latest.json" \
            --endpoint-url "${ENDPOINT}" \
            --region auto \
            --content-type application/json
          echo "Uploaded to s3://${R2_BUCKET}/${PREFIX}/${TAG}/ and s3://${R2_BUCKET}/${PREFIX}/latest.json"
