# Kiểm tra latest.json trên GitHub (cấu trúc Tauri + tuỳ chọn tải thử asset).
# Không cần secrets. Nếu release là draft hoặc chưa có latest.json → job fail (đúng kỳ vọng).

name: Verify updater manifest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"
  push:
    branches: [main, master, develop]
    paths:
      - ".github/workflows/verify-updater.yml"
      - "scripts/verify-updater-manifest.mjs"
      - "src-tauri/tauri.conf.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate latest.json (+ HEAD assets)
        run: node scripts/verify-updater-manifest.mjs --probe
